name: Governance Freeze CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Enterprise Tests
    runs-on: ubuntu-latest
    needs: [spec-governance]
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install backend
        run: cd backend && npm ci
      - name: Run backend tests
        env:
          JWT_SECRET: testsecret
          MONGODB_URI: mongodb://localhost:27017/freeze_test
        run: cd backend && npm run test:backend
      - name: Seed Database for Audit
        env:
          MONGODB_URI: mongodb://localhost:27017/freeze_test
        run: |
          cd backend && npm run seed:permissions
          cd backend && npm run seed:modules
      - name: Run database audit
        env:
          MONGODB_URI: mongodb://localhost:27017/freeze_test
        run: cd backend && npm run db:audit

  frontend:
    name: Frontend Governance Tests
    runs-on: ubuntu-latest
    needs: [spec-governance]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Run frontend tests
        run: cd frontend && npm run test:frontend

  e2e:
    name: Playwright E2E Coverage (Memory DB)
    runs-on: ubuntu-latest
    needs: [spec-governance, backend, frontend]
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd frontend && npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Start services and run tests
        env:
          JWT_SECRET: testsecret
          MONGODB_URI: mongodb://localhost:27017/e2e_memory_fallback
          NODE_ENV: test
        run: |
          cd backend && npm run start &
          cd frontend && npm run dev &
          npx wait-on http://localhost:3000
          cd frontend && npx playwright test

  # ── Spec-Governance is defined in spec-governance.yml ─────────────────────
  # Referenced here so the jobs above can declare `needs: [spec-governance]`.
  # GitHub Actions resolves cross-workflow job dependencies automatically
  # when both workflows trigger on the same event.
  spec-governance:
    name: SPEC-KIT Governance Gate
    uses: ./.github/workflows/spec-governance.yml

